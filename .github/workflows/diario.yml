name: informe-diario
on:
  schedule:
    # El agente comprueba solo, con "horarios" de config.yaml (7:00 y 15:00 Madrid),
    # si le toca enviar. Por eso se lanza en ambos horarios (verano/invierno): la
    # ejecución que no toque saldrá enseguida sin hacer nada, y no duplica envíos.
    - cron: "0 5 * * *"    # 7:00 Madrid en horario de verano (CEST, UTC+2)
    - cron: "0 6 * * *"    # 7:00 Madrid en horario de invierno (CET, UTC+1)
    - cron: "0 13 * * *"   # 15:00 Madrid en horario de verano
    - cron: "0 14 * * *"   # 15:00 Madrid en horario de invierno
  workflow_dispatch:       # botón "Run workflow" para probar a mano
permissions:
  contents: write
jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: playwright install chrome || true
      - run: python agente.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
      - name: Guardar histórico
        run: |
          git config user.name "agente-perfumes"
          git config user.email "agente-perfumes@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "datos $(date -u +%F)" && git push)
