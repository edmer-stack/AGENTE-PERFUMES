# ============================================================
#  CONFIGURACIÓN DEL AGENTE DE PERFUMES  (es el ÚNICO archivo que tocarás)
# ============================================================

horarios: [435, 885]      # minutos desde medianoche (hora Madrid) EN LOS QUE EMPIEZA A BUSCAR.
                          # 435 = 7:15 · 885 = 14:45. El agente tarda en torno a 1 hora en terminar
                          # (depende de cuántas tiendas respondan ese día), así que estas horas de
                          # inicio están pensadas para que el informe llegue sobre las 8:30 y las 16:00.
                          # Si ves que llega antes o después de lo que quieres, ajusta estos números:
                          # cada 15 minutos son 15 unidades (7:15 = 7*60+15 = 435).
paralelismo: 4            # cuántas tiendas/perfumes busca el agente A LA VEZ, en vez de uno a uno.
                          # Más alto = más rápido, pero exige más memoria y CPU. 4 es un punto de
                          # equilibrio razonable tanto para un PC normal como para GitHub Actions.
                          # Si tu PC va muy lento o se cuelga, baja esto a 2.
presupuesto_alternativas: 70   # € máximo (precio total) para perfumes alternativos
min_dias_historial: 14    # por debajo de esto el agente usa "modo arranque"

impuestos:
  iva: 0.21               # IVA español
  arancel: 0.0            # arancel UE de perfumería (partida 3303): 0 %. VERIFÍCALO antes de fiarte
  gestion_aduana: 0.0     # € fijos que cobra el transportista por gestionar aduana (DHL/UPS ~ 5-15 €)

# ------------------------------------------------------------
#  TIENDAS  (añade, quita o corrige a tu gusto)
#   web           : página principal de la tienda (el agente escribe el perfume en su buscador)
#   search        : (opcional) URL de búsqueda directa si la conoces; {q} se sustituye por la búsqueda
#   activa        : false para desactivar una tienda sin borrarla
#   origen        : UE | fuera_UE   (fuera_UE => se aplican arancel + gestión de aduana)
#   iva_incluido  : true si el precio mostrado ya lleva IVA (casi todas las de España/UE)
#   envio         : coste de envío estándar a España (€)
#   envio_gratis_desde : importe a partir del cual el envío es gratis
#   tipo          : nuevo | segunda_mano | decant   (los dos últimos SOLO si garantia: true)
#   garantia      : true si la tienda ofrece garantía/devolución en ese tipo de producto
#  IMPORTANTE: las URLs de búsqueda y los costes de envío son puntos de partida;
#  compruébalos una vez en cada web.
# ------------------------------------------------------------
